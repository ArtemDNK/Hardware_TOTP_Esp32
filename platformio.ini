; ESP32-C6 TOTP Token
; Официальная платформа espressif32 в PlatformIO не поддерживает Arduino 3.x для C6,
; поэтому используется форк pioarduino.

[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2
    adafruit/RTClib
