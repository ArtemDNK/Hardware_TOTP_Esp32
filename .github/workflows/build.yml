name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секретов репозитория"
          else
            echo "Подпись: debug-ключ сборщика (секрет SIGNING_KEYSTORE_BASE64 не задан)"
          fi

      - name: Unit tests and APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Could not|What went wrong|Exception" "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          find app/build/test-results -name "*.xml" -exec grep -h -A3 "<failure" {} + 2>/dev/null | head -30 | while IFS= read -r line; do
            echo "::error::test: ${line//%/%25}"
          done

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TotpTokenSetup.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: TotpTokenSetup-apk
          path: ${{ runner.temp }}/TotpTokenSetup.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "$RUNNER_TEMP/TotpTokenSetup.apk" \
            firmware/firmware.factory.bin \
            --target "$GITHUB_SHA" \
            --title "Последняя сборка" \
            --notes "Собрано автоматически из коммита $GITHUB_SHA.

          - **TotpTokenSetup.apk** — Android-утилита настройки токена (USB OTG)
          - **firmware.factory.bin** — прошивка ESP32-C6, шьётся с адреса 0x0:
            \`esptool --chip esp32c6 write-flash 0x0 firmware.factory.bin\`"
