<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Hardware TOTP — схема подключения</text>

  <!-- ESP32-C6 -->
  <rect x="50" y="70" width="230" height="420" rx="10" fill="#1f2937"/>
  <text x="165" y="100" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">ESP32-C6</text>
  <g fill="#e5e7eb" font-size="14" text-anchor="end">
    <text x="262" y="140">3V3</text>
    <text x="262" y="180">GND</text>
    <text x="262" y="220">GPIO6</text>
    <text x="262" y="260">GPIO7</text>
    <text x="262" y="300">GPIO2</text>
    <text x="262" y="340">GPIO3</text>
    <text x="262" y="380">GPIO4</text>
    <text x="262" y="420">GPIO18</text>
    <text x="262" y="460">GPIO19</text>
  </g>
  <g fill="#fbbf24">
    <circle cx="280" cy="135" r="5"/><circle cx="280" cy="175" r="5"/><circle cx="280" cy="215" r="5"/>
    <circle cx="280" cy="255" r="5"/><circle cx="280" cy="295" r="5"/><circle cx="280" cy="335" r="5"/>
    <circle cx="280" cy="375" r="5"/><circle cx="280" cy="415" r="5"/><circle cx="280" cy="455" r="5"/>
  </g>

  <!-- OLED + EC11 module -->
  <rect x="610" y="70" width="250" height="420" rx="12" fill="#1d4ed8"/>
  <text x="735" y="100" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Модуль 1.3" OLED + EC11</text>
  <g fill="#e0e7ff" font-size="13">
    <text x="634" y="140">VCC</text>
    <text x="634" y="180">GND</text>
    <text x="634" y="220">SDA</text>
    <text x="634" y="260">SCL</text>
    <text x="634" y="300">CON</text>
    <text x="634" y="340">BAK</text>
    <text x="634" y="380">PSH</text>
    <text x="634" y="420">TRA</text>
    <text x="634" y="460">TRB</text>
  </g>
  <g fill="#e0e7ff" font-size="11" fill-opacity="0.8">
    <text x="690" y="300">CONFIRM</text>
    <text x="690" y="340">BACK</text>
    <text x="690" y="380">нажатие ручки</text>
    <text x="690" y="420">энкодер A</text>
    <text x="690" y="460">энкодер B</text>
  </g>
  <rect x="700" y="120" width="140" height="70" rx="3" fill="#000" stroke="#93c5fd"/>
  <text x="770" y="162" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="20">482 913</text>
  <text x="770" y="208" text-anchor="middle" fill="#bfdbfe" font-size="11">SH1106, I2C 0x3C</text>
  <circle cx="795" cy="250" r="26" fill="#111827" stroke="#9ca3af" stroke-width="2"/>
  <line x1="795" y1="250" x2="808" y2="234" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>

  <!-- DS3231 -->
  <rect x="340" y="500" width="210" height="80" rx="10" fill="#14532d"/>
  <text x="375" y="530" fill="#fff" font-weight="600">DS3231 RTC</text>
  <text x="375" y="548" fill="#bbf7d0" font-size="12">I2C 0x68</text>
  <circle cx="510" cy="540" r="24" fill="#d1d5db" stroke="#6b7280"/>
  <text x="510" y="544" text-anchor="middle" font-size="10" fill="#374151">CR2032</text>
  <g fill="#e5e7eb" font-size="11" text-anchor="middle">
    <text x="360" y="573">VCC</text><text x="390" y="573">GND</text><text x="420" y="573">SDA</text><text x="450" y="573">SCL</text>
  </g>

  <!-- wires to module -->
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M280 135 H620" stroke="#dc2626"/>
    <path d="M280 175 H620" stroke="#111"/>
    <path d="M280 215 H620" stroke="#2563eb"/>
    <path d="M280 255 H620" stroke="#ca8a04"/>
    <path d="M280 295 H620" stroke="#16a34a"/>
    <path d="M280 335 H620" stroke="#9333ea"/>
    <path d="M280 375 H620" stroke="#ea580c"/>
    <path d="M280 415 H620" stroke="#0891b2"/>
    <path d="M280 455 H620" stroke="#db2777"/>
  </g>

  <!-- I2C branch to DS3231 -->
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M360 135 V500" stroke="#dc2626"/>
    <path d="M390 175 V500" stroke="#111"/>
    <path d="M420 215 V500" stroke="#2563eb"/>
    <path d="M450 255 V500" stroke="#ca8a04"/>
  </g>
  <g><circle cx="360" cy="135" r="4" fill="#dc2626"/><circle cx="390" cy="175" r="4" fill="#111"/>
     <circle cx="420" cy="215" r="4" fill="#2563eb"/><circle cx="450" cy="255" r="4" fill="#ca8a04"/></g>
  <!-- crossings: small white gaps to show wires do not connect -->
  <g fill="#fff">
    <rect x="356" y="171" width="8" height="8"/><rect x="356" y="211" width="8" height="8"/><rect x="356" y="251" width="8" height="8"/>
    <rect x="356" y="291" width="8" height="8"/><rect x="356" y="331" width="8" height="8"/><rect x="356" y="371" width="8" height="8"/>
    <rect x="356" y="411" width="8" height="8"/><rect x="356" y="451" width="8" height="8"/>
    <rect x="386" y="211" width="8" height="8"/><rect x="386" y="251" width="8" height="8"/><rect x="386" y="291" width="8" height="8"/>
    <rect x="386" y="331" width="8" height="8"/><rect x="386" y="371" width="8" height="8"/><rect x="386" y="411" width="8" height="8"/>
    <rect x="386" y="451" width="8" height="8"/>
    <rect x="416" y="251" width="8" height="8"/><rect x="416" y="291" width="8" height="8"/><rect x="416" y="331" width="8" height="8"/>
    <rect x="416" y="371" width="8" height="8"/><rect x="416" y="411" width="8" height="8"/><rect x="416" y="451" width="8" height="8"/>
    <rect x="446" y="291" width="8" height="8"/><rect x="446" y="331" width="8" height="8"/><rect x="446" y="371" width="8" height="8"/>
    <rect x="446" y="411" width="8" height="8"/><rect x="446" y="451" width="8" height="8"/>
  </g>
  <!-- redraw vertical segments over gaps -->
  <g stroke-width="3">
    <line x1="360" y1="140" x2="360" y2="500" stroke="#dc2626"/>
    <line x1="390" y1="180" x2="390" y2="500" stroke="#111"/>
    <line x1="420" y1="220" x2="420" y2="500" stroke="#2563eb"/>
    <line x1="450" y1="260" x2="450" y2="500" stroke="#ca8a04"/>
  </g>

  <text x="50" y="520" font-size="12" fill="#444">VCC модуля — только от 3V3:</text>
  <text x="50" y="536" font-size="12" fill="#444">подтяжки кнопок на модуле идут к VCC,</text>
  <text x="50" y="552" font-size="12" fill="#444">при 5 В на GPIO попадёт 5 В.</text>
  <text x="50" y="576" font-size="12" fill="#444">CON / BAK / PSH будят токен из сна.</text>
</svg>
